apiVersion: v3.2.0
kind: DataContract
id: bronze.bcb.sgs.cdi_diario
name: CDI diário (bronze)
version: 1.0.0
status: active
domain: financeiro
team:
  name: data-ingestion
description:
  purpose: >-
    Observação diária do CDI (SGS série 12) exatamente como veio da API do Banco Central,
    uma partição por data de referência.
  usage: Fonte da silver do domínio financeiro (camada 5).
tags: [bronze, bcb, sgs]
servers:
  - server: bronze
    type: s3
    environment: dev
    location: s3://lab-data-dev-bronze-<account_id>/bcb/sgs/cdi_diario/
    format: json
    description: Partições reference_date=AAAA-MM-DD, cada uma com data.json e _manifest.json.
schema:
  - name: cdi_diario
    physicalName: bcb_sgs_cdi_diario
    logicalType: object
    description: A observação do dia da partição.
    properties:
      - { name: data,  logicalType: string, physicalType: string, required: true, description: "Data da observação (dd/mm/aaaa); igual à reference_date da partição." }
      - { name: valor, logicalType: string, physicalType: string, required: true, description: "Taxa DI do dia, em % ao dia, como texto." }
    quality:
      - { type: library, metric: rowCount, mustBe: 1, description: "Cada partição tem exatamente uma observação: a do próprio dia." }
slaProperties:
  - { property: freshness, value: 4, unit: d, description: "Cobre um feriado prolongado; acima disso, alerta de frescor." }
customProperties:
  - { property: classification, value: public }
  - { property: criticality,    value: medium }
  - { property: depends_on,     value: [source.bcb.sgs.cdi_diario] }
  - { property: trigger,        value: all }
  - property: produced_by
    value: { tool: lambda, repository: data-ingestion, reference: pipelines/bcb/sgs/cdi_diario.yml }
