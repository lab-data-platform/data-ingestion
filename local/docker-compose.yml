# Ambiente local da ingestão: tudo na sua máquina, sem tocar na AWS nem na API real do BCB.
# Subir: make local-up · Testar: make local-test · Derrubar: make local-down
# Com linhagem no Marquez: make local-up LINEAGE=1 (interface em http://localhost:3000)

name: data-ingestion

services:
  moto:
    image: motoserver/moto:5.2.5
    ports: ["5100:5000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 2s
      timeout: 2s
      retries: 15

  bcb-stub:
    image: python:3.13-slim
    command: ["python", "/app/server.py"]
    volumes:
      - ./bcb-stub/server.py:/app/server.py:ro
      - ../tests/fixtures/bcb/sgs/cdi_diario:/fixtures:ro

  lambda:
    build:
      context: ..
      dockerfile: local/Dockerfile
    ports: ["9000:8080"]
    depends_on:
      moto: { condition: service_healthy }
      bcb-stub: { condition: service_started }
    environment:
      LABDATA_PIPELINE: bcb/sgs/cdi_diario
      LABDATA_ENV: dev
      BRONZE_BUCKET: lab-data-dev-bronze-123456789012
      BCB_SGS_BASE_URL: http://bcb-stub:8080/dados/serie
      AWS_ENDPOINT_URL: http://moto:5000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-2
      OPENLINEAGE_URL: ${OPENLINEAGE_URL:-}
      OPENLINEAGE_DISABLED: ${OPENLINEAGE_DISABLED:-true}

  # --- Linhagem (opcional): make local-up LINEAGE=1 ----------------------------------------------
  marquez-db:
    image: postgres:16
    profiles: [lineage]
    environment: { POSTGRES_USER: marquez, POSTGRES_PASSWORD: marquez, POSTGRES_DB: marquez }

  marquez:
    image: marquezproject/marquez:0.51.1
    profiles: [lineage]
    depends_on: [marquez-db]
    ports: ["5002:5000"]
    environment: { MARQUEZ_PORT: 5000, POSTGRES_HOST: marquez-db, POSTGRES_PORT: 5432, POSTGRES_DB: marquez, POSTGRES_USER: marquez, POSTGRES_PASSWORD: marquez }

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    profiles: [lineage]
    depends_on: [marquez]
    ports: ["3000:3000"]
    restart: on-failure
    environment: { MARQUEZ_HOST: marquez, MARQUEZ_PORT: 5000, WEB_PORT: 3000 }
