[project]
name = "labdata-ingestion"
version = "0.1.0"
description = "Ingestão das fontes de dados para o bronze da plataforma lab-data"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
    "openlineage-python>=1.55",
    "tzdata>=2025.2",        # fuso America/Sao_Paulo garantido no runtime da Lambda
]

[dependency-groups]
dev = [
    "boto3>=1.43",           # já vem no runtime da Lambda; aqui só para testes e ambiente local
    "moto[s3,ssm,events]>=5.2",
    "pytest>=9.2",
    "jsonschema>=4.26",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# labdata e labdata.assets são namespace packages (sem __init__.py), compartilhados com outros repositórios.
packages = ["src/labdata"]

[tool.hatch.build.targets.wheel.force-include]
# Os contratos ODCS vão dentro do pacote: a lib labdata.assets lê daqui.
"assets" = "labdata/assets/_contracts"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contracts"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["integration: precisa do ambiente local (make local-up)"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
